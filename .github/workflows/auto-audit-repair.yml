name: DAZ Guardián (revisa y repara cada 4 horas)

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daz-guardian
  cancel-in-progress: false

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Revisar y reparar web y Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ES: ${{ secrets.TELEGRAM_CHANNEL_ES }}
          TELEGRAM_CHANNEL_EN: ${{ secrets.TELEGRAM_CHANNEL_EN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python scripts/guardian.py

      - name: Guardar reparaciones
        run: |
          git config user.name "DAZ Guardian Bot"
          git config user.email "action@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Guardián: reparaciones automáticas" && git pull --rebase && git push)
