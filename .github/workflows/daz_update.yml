name: DAZ Premium Fit Autonomous Engine

on:
  schedule:
    # Se ejecuta todos los días automáticamente a las 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hub-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DAZ Hub Engine & Self-Audit
        run: python scripts/daz_hub_engine.py

      - name: Commit and push updated JSON data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "DAZ Autonomous Engine"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily Auto-Update & Audit: DAZ Performance Hub" && git push)
