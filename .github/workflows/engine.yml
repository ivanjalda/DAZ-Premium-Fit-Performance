name: DAZ Engine & Morning Coach Diario

on:
  schedule:
    # Se ejecuta cada mañana a primera hora (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Motor Principal y Revisor
        run: |
          python scripts/engine.py
          python scripts/revisor.py

      - name: Enviar Entrenamientos Personalizados y Canales ES/EN
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_ADMIN_SECRET: ${{ secrets.CF_ADMIN_SECRET }}
          TELEGRAM_CHANNEL_ES: ${{ secrets.TELEGRAM_CHANNEL_ES }}
          TELEGRAM_CHANNEL_EN: ${{ secrets.TELEGRAM_CHANNEL_EN }}
        run: python scripts/telegram_coach.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "DAZ Engine Bot"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización diaria y envío matinal DAZ Performance" && git push)
