<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenamiento Élite & Biomecánica | DAZ Premium Fit Performance</title>
  <style>
    .sub-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 26px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .sub-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.86rem;
      transition: all 0.2s;
    }
    .sub-btn.active {
      background: var(--gold);
      color: #060709;
      border-color: var(--gold);
    }
    .muscle-pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .m-pill {
      background: #0b0d10;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 700;
    }
    .m-pill.active {
      border-color: var(--crimson-bright);
      color: #fff;
      background: rgba(185, 28, 28, 0.25);
    }
    .biomech-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      align-items: start;
    }
    .svg-box {
      background: #060709;
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }
    .svg-box svg { width: 100%; max-width: 260px; height: auto; }
    .ex-item {
      padding: 15px 18px;
      background: #0b0d10;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .ex-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }
    .ex-head strong { color: var(--gold); font-size: 1.03rem; }
    .ex-meta { font-family: monospace; font-size: 0.84rem; color: #fca5a5; }
    .ex-cue { font-size: 0.9rem; color: var(--text-muted); }

    @media (max-width: 900px) {
      .biomech-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<section class="daz-page-banner">
  <span class="kicker">MÓDULO 01 • BIOMECÁNICA E HIPERTROFIA</span>
  <h1>Arquitectura de Entrenamiento Personal</h1>
  <p>Protocolos estructurados por grupo muscular con guías visuales de ejecución, rutinas según días disponibles (3 a 6), sistema americano Push/Pull/Legs y bloques de especialización por frecuencia.</p>
</section>

<main class="daz-container">
  <div class="sub-nav">
    <button class="sub-btn active" onclick="showTrainTab('muscles', this)">Por Grupo Muscular + Diagrama</button>
    <button class="sub-btn" onclick="showTrainTab('days', this)">Entrenamientos por Días (3 a 6)</button>
    <button class="sub-btn" onclick="showTrainTab('ppl', this)">Estilo Americano (Push / Pull / Legs)</button>
    <button class="sub-btn" onclick="showTrainTab('freq', this)">Especialización por Frecuencia</button>
  </div>

  <div id="view-muscles" class="t-view">
    <div class="muscle-pills" id="muscle-pills"></div>
    <div class="card" id="muscle-card"></div>
  </div>

  <div id="view-days" class="t-view grid-2" style="display:none;"></div>
  <div id="view-ppl" class="t-view" style="display:none;"></div>
  <div id="view-freq" class="t-view grid-2" style="display:none;"></div>
</main>

<script src="nav.js"></script>
<script>
  const BIOMECH_SVGS = {
    bench_press: `
      <svg viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="25" y="125" width="170" height="10" rx="3" fill="#232730"/>
        <rect x="55" y="135" width="10" height="30" fill="#232730"/>
        <rect x="155" y="135" width="10" height="30" fill="#232730"/>
        <line x1="55" y1="120" x2="125" y2="95" stroke="#9ca3af" stroke-width="8" stroke-linecap="round"/>
        <circle cx="138" cy="86" r="10" fill="#d4af37"/>
        <polyline points="115,100 105,65 115,42" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="70" y1="42" x2="160" y2="42" stroke="#d4af37" stroke-width="4"/>
        <rect x="65" y="26" width="8" height="32" rx="2" fill="#ef4444"/>
        <rect x="157" y="26" width="8" height="32" rx="2" fill="#ef4444"/>
        <path d="M115 32 L115 12 M109 18 L115 12 L121 18" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        <text x="110" y="172" fill="#9ca3af" font-size="10" text-anchor="middle" font-family="monospace">EMPUJE CLAVICULAR 30°</text>
      </svg>`,
    lat_pulldown: `
      <svg viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="110" y1="10" x2="110" y2="48" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
        <line x1="65" y1="48" x2="155" y2="48" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
        <circle cx="110" cy="76" r="10" fill="#d4af37"/>
        <path d="M92 94 L128 94 L120 142 L100 142 Z" fill="#ef4444" fill-opacity="0.35" stroke="#ef4444" stroke-width="2"/>
        <polyline points="68,48 76,82 94,95" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="152,48 144,82 126,95" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M55 62 L55 92 M49 85 L55 92 L61 85" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        <text x="110" y="172" fill="#9ca3af" font-size="10" text-anchor="middle" font-family="monospace">ADUCCIÓN DORSAL EN V</text>
      </svg>`,
    squat: `
      <svg viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="30" y1="155" x2="190" y2="155" stroke="#232730" stroke-width="4"/>
        <polyline points="115,152 138,116 92,102" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="92" y1="102" x2="114" y2="56" stroke="#f3f4f6" stroke-width="8" stroke-linecap="round"/>
        <circle cx="120" cy="42" r="10" fill="#d4af37"/>
        <circle cx="106" cy="56" r="12" fill="#d4af37" fill-opacity="0.25" stroke="#d4af37" stroke-width="3"/>
        <path d="M72 75 L72 115 M66 108 L72 115 L78 108" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        <text x="110" y="172" fill="#9ca3af" font-size="10" text-anchor="middle" font-family="monospace">FLEXIÓN PROFUNDA RODILLA/CADERA</text>
      </svg>`,
    hip_thrust: `
      <svg viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="25" y="95" width="42" height="60" rx="4" fill="#232730"/>
        <line x1="20" y1="155" x2="200" y2="155" stroke="#232730" stroke-width="4"/>
        <polyline points="62,96 115,96 155,112 155,152" stroke="#f3f4f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="52" cy="84" r="9" fill="#d4af37"/>
        <circle cx="115" cy="96" r="16" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="3"/>
        <path d="M115 74 L115 50 M109 56 L115 50 L121 56" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        <text x="110" y="172" fill="#9ca3af" font-size="10" text-anchor="middle" font-family="monospace">EXTENSIÓN PÉLVICA MÁXIMA</text>
      </svg>`,
    bicep_curl: `
      <svg viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="105" cy="36" r="10" fill="#d4af37"/>
        <line x1="105" y1="50" x2="105" y2="135" stroke="#9ca3af" stroke-width="9" stroke-linecap="round"/>
        <polyline points="105,62 105,102 142,74" stroke="#f3f4f6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="135" y="64" width="16" height="10" rx="2" fill="#ef4444"/>
        <path d="M148 96 A 32 32 0 0 0 148 68" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        <text x="110" y="172" fill="#9ca3af" font-size="10" text-anchor="middle" font-family="monospace">SUPINACIÓN Y FLEXIÓN CODO</text>
      </svg>`,
    lateral_raise: `
      <svg viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="110" cy="42" r="10" fill="#d4af37"/>
        <line x1="110" y1="56" x2="110" y2="140" stroke="#9ca3af" stroke-width="9" stroke-linecap="round"/>
        <line x1="42" y1="68" x2="178" y2="68" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round"/>
        <rect x="34" y="61" width="10" height="14" rx="2" fill="#ef4444"/>
        <rect x="176" y="61" width="10" height="14" rx="2" fill="#ef4444"/>
        <path d="M46 94 A 45 45 0 0 1 44 74" stroke="#10b981" stroke-width="2.5"/>
        <path d="M174 94 A 45 45 0 0 0 176 74" stroke="#10b981" stroke-width="2.5"/>
        <text x="110" y="172" fill="#9ca3af" font-size="10" text-anchor="middle" font-family="monospace">ABDUCCIÓN PLANO ESCAPULAR</text>
      </svg>`
  };

  let TRAIN_DATA = null;

  fetch("data/fitness_plans.json")
    .then(r => r.json())
    .then(data => {
      TRAIN_DATA = data;
      document.getElementById("muscle-pills").innerHTML = data.by_muscle_group.map((m, i) => `
        <button class="m-pill ${i === 0 ? 'active' : ''}" onclick="renderMuscle(${i}, this)">${m.muscle}</button>
      `).join("");
      renderMuscle(0);

      document.getElementById("view-days").innerHTML = data.by_days.map(d => `
        <div class="card">
          <span class="tag">${d.level}</span>
          <h3>${d.days}</h3>
          <p style="color:var(--gold); font-size:0.86rem; margin-bottom:6px;">${d.schedule}</p>
          <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:10px;">${d.focus}</p>
          <ul class="clean-list">${d.sessions.map(s => `<li>${s}</li>`).join("")}</ul>
        </div>
      `).join("");

      const ppl = data.american_ppl;
      document.getElementById("view-ppl").innerHTML = `
        <div class="card" style="margin-bottom:22px;">
          <span class="tag tag-red">ESTÁNDAR CULTURISMO AMERICANO</span>
          <h3>${ppl.title}</h3>
          <p style="color:var(--text-muted);">${ppl.description}</p>
        </div>
        <div class="grid-3">
          ${ppl.blocks.map(b => `
            <div class="card">
              <span class="tag">${b.tag}</span>
              <h3>${b.muscles}</h3>
              <ul class="clean-list">${b.routine.map(r => `<li>${r}</li>`).join("")}</ul>
            </div>
          `).join("")}
        </div>
      `;

      document.getElementById("view-freq").innerHTML = data.frequency_specialization.map(f => `
        <div class="card">
          <span class="tag tag-red">BLOQUE DE ESPECIALIZACIÓN</span>
          <h3>${f.name}</h3>
          <p style="color:var(--gold); font-size:0.9rem; margin:8px 0;"><strong>Distribución:</strong> ${f.split}</p>
          <p style="color:#e5e7eb; font-size:0.9rem; margin-bottom:8px;"><strong>Volumen:</strong> ${f.weekly_sets}</p>
          <p style="color:var(--text-muted); font-size:0.88rem;">${f.ideal_for}</p>
        </div>
      `).join("");
    });

  function renderMuscle(idx, btn) {
    if (btn) {
      document.querySelectorAll(".m-pill").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
    }
    const m = TRAIN_DATA.by_muscle_group[idx];
    document.getElementById("muscle-card").innerHTML = `
      <div class="biomech-grid">
        <div class="svg-box">
          ${BIOMECH_SVGS[m.svg_type] || ""}
          <p style="font-size:0.82rem; color:var(--text-muted); margin-top:10px;">${m.biomechanics}</p>
        </div>
        <div>
          <span class="tag">ANATOMÍA & EJECUCIÓN</span>
          <h3 style="font-size:1.45rem; margin-bottom:14px;">${m.muscle}</h3>
          ${m.exercises.map(ex => `
            <div class="ex-item">
              <div class="ex-head">
                <strong>${ex.name}</strong>
                <span class="ex-meta">${ex.sets} | Descanso: ${ex.rest}</span>
              </div>
              <div class="ex-cue">Técnica: ${ex.cue}</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  function showTrainTab(tab, btn) {
    document.querySelectorAll(".sub-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".t-view").forEach(v => v.style.display = "none");
    const target = document.getElementById("view-" + tab);
    target.style.display = (tab === "days" || tab === "freq") ? "grid" : "block";
  }
</script>
</body>
</html>
